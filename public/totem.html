<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totem de Autoatendimento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            padding: 60px 40px;
            text-align: center;
        }

        .title {
            font-size: 48px;
            color: #2d3748;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .subtitle {
            font-size: 22px;
            color: #718096;
            margin-bottom: 50px;
            font-weight: 500;
        }

        .priority-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 50px;
        }

        .priority-btn {
            padding: 50px 30px;
            font-size: 28px;
            font-weight: 700;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }

        .priority-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.2);
            transition: left 0.5s ease;
        }

        .priority-btn:hover::before {
            left: 100%;
        }

        .priority-btn:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }

        .priority-btn:active {
            transform: translateY(-4px);
        }

        .priority-btn.p80 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .priority-btn.p60 {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .priority-btn.pcd {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }

        .priority-btn.geral {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }

        .btn-icon {
            font-size: 64px;
            display: block;
            margin-bottom: 15px;
        }

        .senha-display {
            display: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 40px;
            border-radius: 25px;
            margin: 40px 0;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            position: relative;
        }

        .senha-display.show {
            display: block;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .senha-tipo {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .senha-numero {
            font-size: 100px;
            font-weight: 900;
            margin: 25px 0;
            text-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .senha-info {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .senha-qr {
            background: white;
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            margin: 20px 0;
        }

        #qrcode {
            display: inline-block;
        }

        .qr-label {
            color: #2d3748;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .action-btn {
            padding: 15px 35px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-print {
            background: white;
            color: #667eea;
            border: 3px solid white;
        }

        .btn-print:hover {
            background: rgba(255,255,255,0.9);
            transform: scale(1.05);
        }

        .btn-new {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 3px solid white;
        }

        .btn-new:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        .countdown {
            margin-top: 20px;
            font-size: 18px;
            opacity: 0.9;
            font-weight: 600;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .alert {
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
            font-weight: 600;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
                border-radius: 0;
                padding: 20px;
            }

            .priority-buttons,
            .action-buttons,
            .alert,
            .title,
            .subtitle,
            .countdown {
                display: none !important;
            }

            .senha-display {
                background: white !important;
                color: black !important;
                box-shadow: none !important;
                padding: 20px;
                border: 2px solid #000;
            }

            .senha-numero {
                color: black !important;
                font-size: 80px;
            }

            .senha-tipo,
            .senha-info {
                color: black !important;
            }

            .senha-qr {
                background: white;
            }

            .qr-label {
                font-size: 12px;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 25px;
            }

            .title {
                font-size: 36px;
            }

            .subtitle {
                font-size: 18px;
            }

            .priority-buttons {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .priority-btn {
                padding: 40px 25px;
                font-size: 24px;
            }

            .btn-icon {
                font-size: 52px;
            }

            .senha-numero {
                font-size: 80px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">🎫 Retire sua Senha</h1>
        <p class="subtitle">Selecione o tipo de atendimento desejado</p>

        <div class="priority-buttons">
            <button class="priority-btn p80" onclick="gerarSenha('P80')">
                <span class="btn-icon">👴</span>
                Prioridade<br>80 Anos ou Mais
            </button>
            <button class="priority-btn p60" onclick="gerarSenha('P60')">
                <span class="btn-icon">👵</span>
                Prioridade<br>60 Anos ou Mais
            </button>
            <button class="priority-btn pcd" onclick="gerarSenha('PCD')">
                <span class="btn-icon">♿</span>
                Pessoa com<br>Deficiência
            </button>
            <button class="priority-btn geral" onclick="gerarSenha('A')">
                <span class="btn-icon">👤</span>
                Atendimento<br>Geral
            </button>
        </div>

        <div id="senhaDisplay" class="senha-display">
            <div class="senha-tipo" id="senhaType"></div>
            <div class="senha-numero" id="senhaNumero"></div>
            <div class="senha-info">Aguarde ser chamado no painel</div>
            
            <div class="senha-qr">
                <div id="qrcode"></div>
                <div class="qr-label">📱 Escaneie para acompanhar no celular</div>
            </div>

            <div class="action-buttons">
                <button class="action-btn btn-print" onclick="imprimirSenha()">
                    🖨️ Imprimir Senha
                </button>
                <button class="action-btn btn-new" onclick="novaSenha()">
                    ➕ Nova Senha
                </button>
            </div>

            <div class="countdown" id="countdown"></div>
        </div>

        <div id="alert" class="alert"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        const API_URL = window.location.origin + '/api';
        let currentSenha = null;
        let resetTimeout = null;
        let countdownInterval = null;
        const RESET_TIME = 30; // 30 segundos

        function getTipoNome(type) {
            const tipos = {
                'P80': '👴 Prioridade 80+',
                'P60': '👵 Prioridade 60+',
                'PCD': '♿ PCD',
                'A': '👤 Atendimento Geral'
            };
            return tipos[type] || type;
        }

        async function gerarSenha(type) {
            const display = document.getElementById('senhaDisplay');

            try {
                const response = await fetch(`${API_URL}/senha`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ type })
                });

                const data = await response.json();

                if (response.ok) {
                    currentSenha = data;

                    console.log('✅ Senha gerada:', data.fullCode);

                    // Mostrar senha
                    document.getElementById('senhaType').textContent = getTipoNome(type);
                    document.getElementById('senhaNumero').textContent = data.fullCode;

                    // Gerar QR Code
                    const qrContainer = document.getElementById('qrcode');
                    qrContainer.innerHTML = '';
                    
                    new QRCode(qrContainer, {
                        text: data.mobileUrl,
                        width: 200,
                        height: 200,
                        colorDark: '#2d3748',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });

                    // Mostrar display
                    display.classList.add('show');
                    showAlert('success', '✅ Senha gerada com sucesso!');

                    // Scroll automático
                    setTimeout(() => {
                        display.scrollIntoView({ 
                            behavior: 'smooth', 
                            block: 'center' 
                        });
                    }, 200);

                    // Beep
                    try {
                        const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZURE=');
                        audio.play();
                    } catch (e) {}

                    // INICIAR AUTO-RESET
                    iniciarAutoReset();
                } else {
                    showAlert('error', data.error || 'Erro ao gerar senha');
                }
            } catch (error) {
                console.error('❌ Erro ao gerar senha:', error);
                showAlert('error', 'Erro ao conectar com o servidor');
            }
        }

        function iniciarAutoReset() {
            // Limpar timers anteriores
            pararAutoReset();

            let timeLeft = RESET_TIME;
            const countdownEl = document.getElementById('countdown');

            // Atualizar countdown a cada segundo
            function atualizarCountdown() {
                countdownEl.textContent = `⏱️ Retornando ao início em ${timeLeft} segundos`;
                timeLeft--;

                if (timeLeft < 0) {
                    console.log('⏱️ Timeout atingido - resetando...');
                    novaSenha();
                }
            }

            // Atualizar imediatamente
            atualizarCountdown();

            // Continuar atualizando
            countdownInterval = setInterval(atualizarCountdown, 1000);

            console.log('⏱️ Auto-reset iniciado (30s)');
        }

        function pararAutoReset() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
                console.log('⏸️ Auto-reset parado');
            }
        }

        function imprimirSenha() {
            if (!currentSenha) {
                showAlert('error', 'Nenhuma senha para imprimir');
                return;
            }

            console.log('🖨️ Imprimindo senha...');
            pararAutoReset(); // Parar countdown

            window.print();

            // Reset após impressão (2 segundos)
            setTimeout(() => {
                console.log('✅ Impressão concluída - resetando...');
                novaSenha();
            }, 2000);
        }

        function novaSenha() {
            console.log('🔄 Resetando totem...');
            
            // Parar auto-reset
            pararAutoReset();

            // Limpar countdown
            document.getElementById('countdown').textContent = '';

            // Scroll para o topo
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // Esconder senha
            setTimeout(() => {
                document.getElementById('senhaDisplay').classList.remove('show');
                currentSenha = null;
                document.getElementById('alert').classList.remove('show');
            }, 300);
        }

        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = `alert ${type} show`;
            alert.textContent = message;

            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        // Esconder alerta ao clicar
        document.getElementById('alert').addEventListener('click', function() {
            this.classList.remove('show');
        });

        // Detectar impressão
        window.addEventListener('afterprint', () => {
            console.log('🖨️ Impressão detectada via afterprint');
        });

        // Log inicial
        console.log('🚀 Totem inicializado');
        console.log('⏱️ Auto-reset configurado para 30 segundos');
    </script>
</body>
</html>
