<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Chamadas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            padding: 2vh 2vw;
            display: flex;
            flex-direction: column;
            max-height: 100vh;
        }

        .header {
            margin-bottom: 3vh;
            flex-shrink: 0;
        }

        .title {
            font-size: clamp(32px, 5vw, 72px);
            font-weight: 900;
            margin-bottom: 1vh;
            text-shadow: 0 4px 8px rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .subtitle {
            font-size: clamp(16px, 2vw, 28px);
            font-weight: 500;
            opacity: 0.9;
        }

        .chamada-atual {
            background: rgba(255,255,255,0.15);
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: clamp(20px, 4vh, 60px);
            margin-bottom: 3vh;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .chamada-label {
            font-size: clamp(18px, 2.5vw, 36px);
            font-weight: 600;
            margin-bottom: 1vh;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .chamada-numero {
            font-size: clamp(60px, 10vw, 140px);
            font-weight: 900;
            margin: 2vh 0;
            animation: pulseNumber 2s infinite;
            text-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        @keyframes pulseNumber {
            0%, 100% {
                transform: scale(1);
                text-shadow: 0 8px 16px rgba(0,0,0,0.4);
            }
            50% {
                transform: scale(1.05);
                text-shadow: 0 12px 24px rgba(0,0,0,0.5);
            }
        }

        .chamada-guiche {
            font-size: clamp(28px, 5vw, 72px);
            font-weight: 800;
            color: #ffd700;
            text-shadow: 0 4px 8px rgba(0,0,0,0.3);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ultimas-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .ultimas-title {
            font-size: clamp(20px, 2.5vw, 32px);
            font-weight: 700;
            margin-bottom: 2vh;
            opacity: 0.9;
            flex-shrink: 0;
        }

        .ultimas-chamadas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: clamp(10px, 2vh, 25px);
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Scrollbar customizada */
        .ultimas-chamadas::-webkit-scrollbar {
            width: 8px;
        }

        .ultimas-chamadas::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .ultimas-chamadas::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
        }

        .ultimas-chamadas::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.5);
        }

        .chamada-item {
            background: rgba(255,255,255,0.1);
            padding: clamp(15px, 2.5vh, 30px);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .chamada-item:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-5px);
        }

        .chamada-item-numero {
            font-size: clamp(28px, 4vw, 48px);
            font-weight: 800;
            margin-bottom: 8px;
        }

        .chamada-item-guiche {
            font-size: clamp(14px, 1.8vw, 22px);
            color: #ffd700;
            font-weight: 600;
        }

        .loading, .no-data {
            font-size: clamp(18px, 2.5vw, 28px);
            opacity: 0.7;
            animation: pulse 1.5s infinite;
            text-align: center;
            padding: 4vh;
        }

        .timestamp {
            position: fixed;
            bottom: 1.5vh;
            right: 2vw;
            font-size: clamp(12px, 1.5vw, 20px);
            opacity: 0.6;
            font-weight: 500;
        }

        .debug {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.9);
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            font-family: monospace;
            max-width: 350px;
            max-height: 400px;
            overflow-y: auto;
            display: none;
            z-index: 9999;
        }

        /* Media queries para ajustes específicos */
        @media (max-height: 800px) {
            .chamada-atual {
                padding: 20px;
                margin-bottom: 2vh;
            }
            
            .chamada-numero {
                margin: 1vh 0;
            }
        }

        @media (max-height: 600px) {
            .header {
                margin-bottom: 1.5vh;
            }
            
            .chamada-atual {
                padding: 15px;
                margin-bottom: 1.5vh;
            }
            
            .ultimas-title {
                margin-bottom: 1vh;
            }
        }

        @media (max-width: 768px) {
            .ultimas-chamadas {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .ultimas-chamadas {
                grid-template-columns: 1fr;
            }
        }

        /* Telas muito grandes */
        @media (min-width: 1920px) {
            .ultimas-chamadas {
                grid-template-columns: repeat(5, 1fr);
            }
        }
    </style>
</head>
<body>
    <div id="debug" class="debug"></div>

    <div class="container">
        <div class="header">
            <h1 class="title">🏥 Painel de Chamadas</h1>
            <p class="subtitle">Aguarde sua senha ser chamada</p>
        </div>

        <div class="chamada-atual">
            <div class="chamada-label">Chamada Atual</div>
            <div class="chamada-numero" id="senhaAtual">---</div>
            <div class="chamada-guiche" id="guicheAtual">Aguarde...</div>
        </div>

        <div class="ultimas-section">
            <div class="ultimas-title">📋 Últimas Chamadas</div>
            <div class="ultimas-chamadas" id="ultimasChamadas">
                <div class="loading">Carregando...</div>
            </div>
        </div>

        <div class="timestamp" id="timestamp"></div>
    </div>

    <script>
        const API_URL = window.location.origin + '/api';
        let updateInterval;
        let lastSenha = null;
        const DEBUG = false;

        function debug(msg) {
            console.log(msg);
            if (DEBUG) {
                const el = document.getElementById('debug');
                el.style.display = 'block';
                const time = new Date().toLocaleTimeString();
                el.innerHTML += `${time}: ${msg}<br>`;
                el.scrollTop = el.scrollHeight;
            }
        }

        async function atualizarPainel() {
            try {
                debug('📡 Buscando histórico...');
                const response = await fetch(`${API_URL}/historico?limit=6`);

                if (!response.ok) {
                    debug(`❌ Erro HTTP: ${response.status}`);
                    throw new Error(`HTTP ${response.status}`);
                }

                const historico = await response.json();
                debug(`✅ Recebeu ${historico.length} chamadas`);

                if (historico.length > 0) {
                    const container = document.getElementById('ultimasChamadas');
                    container.innerHTML = '';

                    // Primeira = chamada atual
                    const primeira = historico[0];
                    document.getElementById('senhaAtual').textContent = primeira.senha;
                    document.getElementById('guicheAtual').textContent = `Guichê ${primeira.guiche}`;
                    
                    debug(`📢 Atual: ${primeira.senha} - Guichê ${primeira.guiche}`);

                    // Demais = histórico
                    if (historico.length > 1) {
                        historico.slice(1, 6).forEach((item, index) => {
                            const div = document.createElement('div');
                            div.className = 'chamada-item';
                            div.innerHTML = `
                                <div class="chamada-item-numero">${item.senha}</div>
                                <div class="chamada-item-guiche">Guichê ${item.guiche}</div>
                            `;
                            container.appendChild(div);
                            debug(`📋 Histórico ${index + 1}: ${item.senha}`);
                        });
                    } else {
                        container.innerHTML = '<div class="no-data">Aguardando próximas chamadas...</div>';
                    }

                    // Som quando nova senha
                    if (lastSenha && lastSenha !== primeira.senha) {
                        debug('🔔 Nova senha detectada!');
                        playBeep();
                    }
                    lastSenha = primeira.senha;

                } else {
                    debug('⚠️ Nenhuma chamada no histórico');
                    document.getElementById('senhaAtual').textContent = '---';
                    document.getElementById('guicheAtual').textContent = 'Aguardando primeira senha...';
                    document.getElementById('ultimasChamadas').innerHTML = '<div class="no-data">Nenhuma senha chamada ainda</div>';
                }

                // Atualizar timestamp
                const now = new Date();
                document.getElementById('timestamp').textContent = 
                    now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            } catch (error) {
                debug('❌ Erro: ' + error.message);
                console.error('Erro ao atualizar painel:', error);
                
                document.getElementById('ultimasChamadas').innerHTML = 
                    `<div class="no-data">Erro ao conectar<br><small>${error.message}</small><br><small>Tentando reconectar...</small></div>`;
            }
        }

        function playBeep() {
            try {
                const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZURE=');
                audio.play().catch(e => debug('🔇 Áudio bloqueado'));
            } catch (e) {
                debug('🔇 Erro ao tocar som');
            }
        }

        // Atualizar imediatamente e a cada 2 segundos
        debug('🚀 Iniciando TV...');
        atualizarPainel();
        updateInterval = setInterval(atualizarPainel, 2000);

        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (updateInterval) clearInterval(updateInterval);
        });

        // Wake Lock
        if ('wakeLock' in navigator) {
            let wakeLock = null;

            const requestWakeLock = async () => {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    debug('🔋 Wake Lock ativado');
                } catch (err) {
                    debug('⚠️ Wake Lock falhou: ' + err.message);
                }
            };

            requestWakeLock();

            document.addEventListener('visibilitychange', async () => {
                if (wakeLock !== null && document.visibilityState === 'visible') {
                    await requestWakeLock();
                }
            });
        }

        // Debug: tecla D
        document.addEventListener('keydown', (e) => {
            if (e.key === 'd' || e.key === 'D') {
                const debugEl = document.getElementById('debug');
                debugEl.style.display = debugEl.style.display === 'none' ? 'block' : 'none';
            }
        });
    </script>
</body>
</html>
